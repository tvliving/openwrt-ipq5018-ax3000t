# 小米 AX3000T v2（RD03v2，高通 IPQ5018）大分区固件编译
# 基于 georgemoussalem/openwrt 的 ipq50xx-ax3000tv2 分支：
#   - target: qualcommax/ipq50xx，设备: xiaomi_ax3000tv2
#   - 分区布局即社区「大分区」方案：ubi_kernel 36M + rootfs 81.5M
#     （替换原厂 rootfs/rootfs_1 30M+30M 双区 + overlay）
# 产物：sysupgrade.bin（已装 OpenWrt 后升级用）+ initramfs-factory.ubi / initramfs-kernel.bin（首刷用）
name: OpenWrt 小米 AX3000T v2 编译

on:
  workflow_dispatch:
    inputs:
      make_release:
        description: '编译完成后发布 Release'
        type: boolean
        default: true
  schedule:
    # UTC 01:00 = 北京时间每周二 09:00
    - cron: '0 1 * * 2'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 1500M
  CCACHE_COMPRESS: 'true'
  CCACHE_NOHASHDIR: 'true'

jobs:
  build:
    name: 🏗️ Xiaomi AX3000T v2 (IPQ5018)
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Checkout 源码（ipq50xx-ax3000tv2 分支）
        uses: actions/checkout@v4
        with:
          ref: ipq50xx-ax3000tv2
          fetch-depth: 1

      - name: 校验设备定义存在
        run: |
          mk="target/linux/qualcommax/image/ipq50xx.mk"
          [ -f "$mk" ] || { echo "::error::缺少 $mk"; exit 1; }
          grep -q "Device/xiaomi_ax3000tv2" "$mk" \
            || { echo "::error::$mk 里没有 Device/xiaomi_ax3000tv2，上游可能已改名"; exit 1; }
          dts="target/linux/qualcommax/dts/ipq5018-ax3000tv2.dts"
          [ -f "$dts" ] || { echo "::error::缺少 $dts"; exit 1; }
          echo ">>> 设备定义检查通过，分区布局："
          grep -n 'label = "ubi_kernel"' -A 2 "$dts"
          grep -n 'label = "rootfs"' -A 2 "$dts"

      - name: 释放磁盘空间并加大 swap
        run: |
          echo "===== 释放前 ====="
          df -h / | tail -1

          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache /usr/local/share/boost \
                      /usr/local/lib/node_modules /usr/lib/jvm \
                      /usr/share/swift /usr/share/miniconda /usr/share/rust \
                      /usr/share/kotlinc /usr/share/gradle-* /opt/az \
                      /opt/microsoft /usr/local/aws-cli /usr/local/.ghcup \
                      /etc/mysql /etc/php /usr/local/go /opt/pipx 2>/dev/null || true

          sudo systemctl stop docker docker.socket containerd 2>/dev/null || true
          sudo rm -rf /var/lib/docker /var/lib/containerd 2>/dev/null || true
          sudo pkill -9 -f dockerd 2>/dev/null || true

          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile
          sudo fallocate -l 4G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=4096
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

          echo "===== 释放后 ====="
          df -h / | tail -1
          free -h | head -3

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc gettext \
            git libncurses-dev libpython3-dev libssl-dev rsync unzip zlib1g-dev file wget \
            curl libelf-dev ecj java-propose-classpath python3-distutils-extra quilt

      - name: 恢复 ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ax3000tv2-ccache-${{ github.run_id }}
          restore-keys: |
            ax3000tv2-ccache-

      - name: 更新并安装 feeds
        run: |
          ./scripts/feeds update -a
          # 只安装 luci 及其依赖；不要全量 install -a，
          # 否则会拉入 video feed 的 qt5/qt6，其 Config.in 存在递归依赖错误导致 defconfig 失败
          ./scripts/feeds install luci

      - name: 生成 .config（AX3000T v2 + LuCI + initramfs）
        run: |
          cat > .config <<EOF
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq50xx=y
          # 设备符号 depends on TARGET_MULTI_PROFILE，不开这个 TARGET_DEVICE_* 会被 Kconfig 隐藏
          CONFIG_TARGET_MULTI_PROFILE=y
          CONFIG_TARGET_DEVICE_qualcommax_ipq50xx_DEVICE_xiaomi_ax3000tv2=y
          CONFIG_TARGET_ROOTFS_INITRAMFS=y
          CONFIG_PACKAGE_luci=y
          CONFIG_CCACHE=y
          EOF
          make defconfig
          # 兜底：若机型符号仍未翻 y，定向翻转后二次 defconfig
          if ! grep -q '^CONFIG_TARGET_DEVICE_qualcommax_ipq50xx_DEVICE_xiaomi_ax3000tv2=y' .config; then
            sed -i 's/^# \(CONFIG_TARGET_DEVICE_qualcommax_ipq50xx_DEVICE_xiaomi_ax3000tv2\) is not set$/\1=y/' .config
            make defconfig
          fi
          echo "===== 关键符号核对 ====="
          grep -E 'CONFIG_TARGET_DEVICE_qualcommax_ipq50xx_DEVICE_xiaomi_ax3000tv2=|CONFIG_TARGET_ROOTFS_INITRAMFS=|CONFIG_PACKAGE_luci=' .config
          grep -q '^CONFIG_TARGET_DEVICE_qualcommax_ipq50xx_DEVICE_xiaomi_ax3000tv2=y' .config \
            || { echo "::error::机型符号未生效"; exit 1; }
          grep -q '^CONFIG_TARGET_ROOTFS_INITRAMFS=y' .config \
            || { echo "::error::initramfs 未生效（首刷镜像会缺失）"; exit 1; }

      - name: 下载源码包
        run: |
          make download -j$(nproc) || make download -j1 V=s

      - name: 编译固件
        run: |
          make -j$(nproc) || make -j1 V=s

      - name: 上传编译日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            logs/
            bin/targets/**/packages.bom
          retention-days: 7
          if-no-files-found: ignore

      - name: 收集产物
        run: |
          mkdir -p out
          d="bin/targets/qualcommax/ipq50xx"
          [ -d "$d" ] || { echo "::error::缺少 $d"; exit 1; }
          find "$d" -maxdepth 1 -type f \
            \( -name '*ax3000tv2*' -o -name 'sha256sums' -o -name 'profiles.json' \
               -o -name '*.buildinfo' -o -name '*.manifest' \) \
            -exec cp {} out/ \; 2>/dev/null || true
          echo "===== 产物 ====="
          ls -lh out
          ls out | grep -q "ax3000tv2.*sysupgrade" \
            || { echo "::error::没有 sysupgrade 产物，编译可能不完整"; exit 1; }
          ls out | grep -q "ax3000tv2.*initramfs" \
            || echo "::warning::没有 initramfs 产物（首刷镜像缺失）"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: images-ax3000tv2
          path: out/
          retention-days: 14

      - name: 发布 Release
        if: ${{ github.event_name == 'schedule' || inputs.make_release != false }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="openwrt-ax3000tv2-$(TZ=Asia/Shanghai date +%Y%m%d)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            OLD="$TAG"
            TAG="${TAG}-r${GITHUB_RUN_NUMBER}"
            echo "::warning::${OLD} 已存在（历史保留），本次使用 ${TAG}"
          fi

          cat > /tmp/notes.md <<EOF
          OpenWrt 小米 AX3000T v2（RD03v2，高通 IPQ5018）大分区固件

          - 基于分支: ipq50xx-ax3000tv2（georgemoussalem IPQ5018 支持树）
          - 分区布局: 大分区（ubi_kernel 36M + rootfs 81.5M，替换原厂双区 + overlay）
          - 首刷: 刷 initramfs-factory.ubi / TFTP initramfs 进临时系统，再 sysupgrade
          - 提交: ${{ github.sha }}
          - 日志: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          - 默认 IP: 192.168.1.1 / 用户名 root / 无密码
          EOF

          ls -lh out/
          gh release create "$TAG" out/* \
            --title "OpenWrt AX3000T v2 ($(TZ=Asia/Shanghai date +%Y-%m-%d))" \
            --notes-file /tmp/notes.md
          echo ">>> 已发布: $TAG"
